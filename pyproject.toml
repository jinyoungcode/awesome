[project]
name = "stockking"
version = "0.1.0"
description = "나는야 주식왕 — 자동매매 시스템 (P0~P1: 백테스트 + 모의투자 전용)"
requires-python = ">=3.11"
dependencies = []  # 코어는 표준 라이브러리만 사용 (의존성 추가는 아키텍트 승인)

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
